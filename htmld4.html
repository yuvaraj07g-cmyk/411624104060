<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            padding: 20px;
            background: #f5f5f5;
        }

     
        :root {
            --theme-color: blue;
        }

   
        nav {
            display: flex;
            flex-direction: column;
            background-color: #222;
            padding: 15px;
            margin-bottom: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px;
            text-align: center;
        }

        nav a:hover {
            background-color: #444;
            border-radius: 5px;
        }

        @media (min-width: 768px) {
            nav {
                flex-direction: row;
                justify-content: center;
                gap: 30px;
            }
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        img {
            display: block;
            width: 300px;
            max-width: 100%;
            margin: 20px auto;
            
            border-radius: 50px;
        }

        video {
            display: block;
            width: 50vw;
            max-width: 100%;
            margin: 20px auto;
            padding: 10px;
            background-color:blue;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: white;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #ddd;
        }


        button {
            display: block;
            margin: 20px auto;
            padding: 12px 25px;
            border: none;
            background-color:blue;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
        }

        button:hover {
            background-color: red;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 30px;
        }

        .grid-item {
            background-color: #ccc;
            padding: 30px;
            text-align: center;
            font-size: 20px;
            border-radius: 8px;
        }
        .grid-item:hover{
            background-color: blue;
        }

        @media (max-width: 767px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <h1>My Responsive Website</h1>

    <img src="https://picsum.photos/400/250" alt="Sample Image">

    <video controls>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <table>
        <tr>
            <th>1</th>
            <th>2</th>
            <th>3</th>
        </tr>
        <tr>
            <td>Some Text</td>
            <td>Some Text</td>
            <td>Some Text</td>
        </tr>
        <tr>
            <td>Some Text</td>
            <td>Some Text</td>
            <td>Some Text</td>
        </tr>
    </table>

    <button>Click Me</button>

    <div class="grid-container">
        <div class="grid-item">1</div>
        <div class="grid-item">2</div>
        <div class="grid-item">3</div>
        <div class="grid-item">4</div>
        <div class="grid-item">5</div>
        <div class="grid-item">6</div>
        <div class="grid-item">7</div>
        <div class="grid-item">8</div>
    </div>

</body>
</html>
